<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjetas CRC Verticales</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <!-- Controles principales -->
        <div class="controls">
            <div class="controls-left">
                <button id="loadFileBtn" class="load-btn">📂 Cargar archivo</button>
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <button id="exportFileBtn" class="export-btn">💾 Exportar</button>
            </div>
            <button id="downloadPdf" class="pdf-btn">📄 Descargar PDF</button>
        </div>

        <div class="cards-container" id="app">
            <!-- Tarjeta 1: Departamento -->
            <div class="card" id="card-departamento">
                <div class="card-header">
                    <div class="header-left">
                        <h2 class="class-name">Departamento</h2>
                        <div class="meta-info">
                            <div class="meta-item">
                                <span class="meta-label">Superclases:</span>
                                <span class="meta-value" contenteditable="false" id="superclass-departamento">—</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Subclases:</span>
                                <span class="meta-value" contenteditable="false" id="subclass-departamento">—</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="delete-card-btn" title="Eliminar tarjeta">🗑️</button>
                    </div>
                </div>

                <div class="card-body">
                    <div class="fields-container" id="fields-departamento">
                      
                    </div>
                    <button class="add-field-btn" data-target="departamento">+ Añadir fila</button>
                </div>
            </div>

         
            <div class="card" id="card-curso">
                <div class="card-header">
                    <div class="header-left">
                        <h2 class="class-name">Curso</h2>
                        <div class="meta-info">
                            <div class="meta-item">
                                <span class="meta-label">Superclases:</span>
                                <span class="meta-value" contenteditable="false" id="superclass-curso">—</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Subclases:</span>
                                <span class="meta-value" contenteditable="false" id="subclass-curso">—</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="delete-card-btn" title="Eliminar tarjeta">🗑️</button>
                    </div>
                </div>

                <div class="card-body">
                    <div class="fields-container" id="fields-curso">
                    
                    </div>
                    <button class="add-field-btn" data-target="curso">+ Añadir fila</button>
                </div>
            </div>

          
            <div class="card" id="card-libro">
                <div class="card-header">
                    <div class="header-left">
                        <h2 class="class-name">Libro de texto</h2>
                        <div class="meta-info">
                            <div class="meta-item">
                                <span class="meta-label">Superclases:</span>
                                <span class="meta-value" contenteditable="false" id="superclass-libro">—</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Subclases:</span>
                                <span class="meta-value" contenteditable="false" id="subclass-libro">—</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="delete-card-btn" title="Eliminar tarjeta">🗑️</button>
                    </div>
                </div>

                <div class="card-body">
                    <div class="fields-container" id="fields-libro">
                       
                    </div>
                    <button class="add-field-btn" data-target="libro">+ Añadir fila</button>
                </div>
            </div>
        </div>

     
        <div class="add-card-container">
            <button id="addCardBtn" class="add-card-btn">➕ Añadir nueva tarjeta</button>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
